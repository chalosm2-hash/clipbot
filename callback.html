<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClipBot – Anmeldung</title><link rel="stylesheet" href="style.css"></head><body>
<header><img src="icon.png" alt="ClipBot"><h1>Fast geschafft!</h1></header>
<div class="box">
<p>Kopiere diese komplette Adresse und füge sie im ClipBot-Fenster ein:</p>
<p><code id="url"></code></p>
<button onclick="navigator.clipboard.writeText(location.href).then(()=>this.textContent='✓ Kopiert!')">Adresse kopieren</button>
</div>
<script>document.getElementById('url').textContent=location.href;</script>
</body></html>
